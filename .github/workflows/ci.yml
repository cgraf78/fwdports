name: CI

on:
  push:
    # main is the only maintained branch. Keep this aligned with the protected
    # default branch so a direct branch-policy change cannot silently narrow CI.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so their full matrices do not all contend
    # for runner capacity at the top of the hour.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@464468328f050e43299298fc0eac8b971ddd38b7
    with:
      # Process groups, tmux direct argv, and BSD command adapters materially
      # differ on macOS, Linux, and Termux, so every PR gets the full shared
      # matrix rather than deferring compatibility to a schedule. The separate
      # job below keeps the stock macOS Bash 3.2 promise explicit: shared CI
      # intentionally installs a current Bash before it invokes consumers.
      matrix-set: full
      profiles: base,python,tmux,openssh-netcat-lsof,procps
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: bash test/run
      # The repository-owned installer authenticates checkout files through
      # Git. Use the shared suite profile rather than a runtime-only image so
      # Termux exercises that same trust boundary instead of skipping it.
      termux-profiles: base,python,tmux,openssh-netcat-lsof,procps

  macos-bash32:
    name: Stock macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise portable surfaces with stock macOS Bash
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          # Keep env-based shebangs and child `bash` calls on the same stock
          # interpreter. This prevents a preinstalled Homebrew Bash from
          # making the job look more portable than the installed command is.
          stock_bin="$RUNNER_TEMP/fwdports-stock-bash"
          mkdir -p "$stock_bin"
          ln -s /bin/bash "$stock_bin/bash"
          export PATH="$stock_bin:$PATH"

          install_prefix="$RUNNER_TEMP/fwdports-bash32"
          PREFIX="$install_prefix" /bin/bash install.sh
          [[ -L "$install_prefix/bin/fwdports" ]]
          "$install_prefix/bin/fwdports" --version

          for suite in autossh-driver builtin-runner cli config driver-api \
            et-driver examples install portability ssh-driver; do
            /bin/bash "test/$suite-test"
          done

  stock-et-contract:
    name: Stock ET 7.0.0 contract
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the publisher's pinned arm64 artifact
        shell: bash
        run: |-
          set -euo pipefail
          asset="$RUNNER_TEMP/et_7.0.0-stable1_arm64.deb"
          curl -fL --retry 3 \
            https://github.com/MisterTea/EternalTerminal/releases/download/et-v7.0.0/et_7.0.0-stable1_arm64.deb \
            -o "$asset"
          printf '%s  %s\n' \
            db31e467c879d8aae24e83a69e9e168e374e6f15ce7e28f64f8b5f53dacab742 \
            "$asset" | sha256sum -c -
          dpkg-deb -x "$asset" "$RUNNER_TEMP/stock-et"

      - name: Install publisher artifact runtime libraries
        shell: bash
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libbrotli1 libprotobuf32t64 libsodium23 libssl3t64 libunwind8 \
            libutempter0 zlib1g

      - name: Verify the real ET client contract
        shell: bash
        run: |-
          bash support/verify-stock-et-contract.sh \
            "$RUNNER_TEMP/stock-et/usr/bin/et"

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, macos-bash32, stock-et-contract]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
      STOCK_ET_RESULT: ${{ needs.stock-et-contract.result }}
    steps:
      - name: Require all fwdports compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"
          printf 'Stock ET 7.0.0 contract: %s\n' "$STOCK_ET_RESULT"

          test "$SHELL_RESULT" = success
          test "$BASH32_RESULT" = success
          test "$STOCK_ET_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Workflow `uses:` refs must be literals. This gate proves those literals
      # still match the repository's one reviewed actions dependency lock.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@464468328f050e43299298fc0eac8b971ddd38b7

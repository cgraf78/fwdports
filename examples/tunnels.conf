# Public, directly tested profile examples.

profile ssh-default
leg web
set web host shell.example.com
set web local-forward 127.0.0.1:8080:127.0.0.1:8080
check web loopback 8080 web

profile ssh-resilient
leg web autossh
set web host shell.example.com
set web local-forward 127.0.0.1:8080:127.0.0.1:8080
set web server-alive-interval 30
set web server-alive-count-max 3
check web tcp 127.0.0.1 8080 web

profile executable-driver
leg demonstration example
failure demonstration preserve
